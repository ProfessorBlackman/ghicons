name: Validate Icons

# Runs on every pull request, and validates the WHOLE collection rather than
# only the files a PR touched. Checking only changed files is how 103 of 106
# icons drifted to a hardcoded fill='#fff' without a single failing build.
on:
  pull_request:
  push:
    branches:
      - dev
      - master
  workflow_dispatch:

jobs:
  validate:
    name: Icon Specification
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Writes a results table to the job summary and annotates failing files.
      # Rules live in docs/ICON-SPEC.md.
      - name: Validate the icon collection
        run: pnpm run validate
