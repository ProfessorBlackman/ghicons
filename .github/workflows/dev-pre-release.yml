name: Dev Pre-release

on:
  push:
    branches:
      - dev

jobs:
  pre-release:
    name: Build & Publish Pre-release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Read version
        id: meta
        run: |
          # The workspace root is private and unversioned; the core package
          # carries the version every package is released at.
          VERSION=$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('packages/core/package.json','utf8')).version)")
          TAG="dev-v${VERSION}-build.${{ github.run_number }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"

      # Pack the real tarballs rather than zipping a build directory, so what
      # reviewers install is byte-for-byte what a release would publish.
      - name: Pack the packages
        run: |
          # `pnpm pack` is not a recursive command, so --filter fails with
          # "Unknown option: 'recursive'". Use -C to target a package, and an
          # absolute destination, because --pack-destination resolves relative
          # to -C rather than to the working directory.
          pnpm -C packages/core  pack --pack-destination "$PWD"
          pnpm -C packages/react pack --pack-destination "$PWD"
          ls -l ./*.tgz

      - name: Create pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          VERSION="${{ steps.meta.outputs.version }}"
          SHORT_SHA="${{ github.sha }}"
          SHORT_SHA="${SHORT_SHA:0:7}"

          gh release create "$TAG" ./*.tgz \
            --prerelease \
            --title "Dev Build: v${VERSION} (build #${{ github.run_number }})" \
            --notes "## Dev Pre-release

          > **Not intended for production.** This is an automated build from the \`dev\` branch.

          | | |
          |---|---|
          | **Version** | \`${VERSION}\` |
          | **Commit** | [\`${SHORT_SHA}\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}) |
          | **Triggered by** | @${{ github.actor }} |
          | **Branch** | \`${{ github.ref_name }}\` |
          | **Build** | [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |

          ## Install locally for testing

          Download the tarballs below, then install the ones you need:

          \`\`\`bash
          # framework-agnostic core: SVG files + registry
          npm install ./ghicons-${VERSION}.tgz

          # React components
          npm install ./ghicons-react-${VERSION}.tgz
          \`\`\`

          \`\`\`tsx
          import { GyeNyame } from '@ghicons/react';
          import { getIcon } from 'ghicons';
          \`\`\`

          > Maintainers: once validated, merge \`dev\` into \`master\` to trigger the production release."
